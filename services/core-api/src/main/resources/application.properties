spring.application.name=clinora-core-api
server.port=${CLINORA_CORE_API_PORT:44220}
server.address=${CLINORA_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.metrics.tags.application=${spring.application.name}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLINORA_OIDC_ISSUER_URI:http://127.0.0.1:44282/realms/clinora}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLINORA_OIDC_JWK_SET_URI:http://127.0.0.1:44282/realms/clinora/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=clinora-core
clinora.web.origin=${CLINORA_WEB_ORIGIN:http://127.0.0.1:44210}
