version: '3'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  doctor:
    desc: Validate local toolchain and repository wiring.
    cmds:
      - corepack pnpm run doctor

  verify:
    desc: Run all foundation validations available in the current bootstrap.
    cmds:
      - corepack pnpm run verify

  java:verify:
    desc: Run Maven verify through the wrapper.
    cmds:
      - corepack pnpm run java:verify

  frontend:check:
    desc: Validate pnpm lockfile, peers and Angular workspace metadata.
    cmds:
      - corepack pnpm run frontend:check

  frontend:verify:
    desc: Run Angular tests and builds, including Storybook.
    cmds:
      - corepack pnpm run frontend:verify

  tools:test:
    desc: Run tests for repository scripts.
    cmds:
      - corepack pnpm run tools:test

  security:check:
    desc: Check production and critical dependency advisories.
    cmds:
      - corepack pnpm run security:check

  git:remote:
    desc: Ensure origin points only to realfelipedeveloper/Clinora.
    cmds:
      - corepack pnpm run git:remote
