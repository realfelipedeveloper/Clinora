name: Publicar status de qualidade

on:
  workflow_run:
    workflows:
      - Qualidade Clinora
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publicar:
    name: Publicar status do PR
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar publicador da branch padrao
        uses: actions/checkout@v7
        with:
          ref: development
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Publicar resultado sem executar codigo do PR
        run: node tools/publish-quality-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
