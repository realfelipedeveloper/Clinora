name: clinora-local

x-java: &java
  image: eclipse-temurin:25.0.4.1_1-jre-alpine-3.24
  command: ["java", "-jar", "/app.jar"]
  user: "10001:10001"
  read_only: true
  init: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    start_period: 30s
    retries: 6

x-static: &static
  image: nginxinc/nginx-unprivileged:alpine3.24
  read_only: true
  init: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 6

services:
  web:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_WEB_PORT:-44210}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/web/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  docs:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_DOCS_PORT:-44211}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/docs/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  core-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_CORE_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_CORE_API_PORT:-44220}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/core-api/target/core-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  payment-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_PAYMENT_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_PAYMENT_API_PORT:-44221}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/payment-api/target/payment-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  notification-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_NOTIFICATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_NOTIFICATION_API_PORT:-44222}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/notification-api/target/notification-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  integration-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_INTEGRATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_INTEGRATION_API_PORT:-44223}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/integration-api/target/integration-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  scheduler-worker:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_SCHEDULER_WORKER_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_SCHEDULER_WORKER_PORT:-44224}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/scheduler-worker/target/scheduler-worker-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

networks:
  clinora:
    name: clinora-local-network
