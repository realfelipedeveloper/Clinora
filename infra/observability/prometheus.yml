global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: clinora-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - core-api:8080
          - payment-api:8080
          - notification-api:8080
          - integration-api:8080
          - scheduler-worker:8080
