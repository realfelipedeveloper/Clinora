name: Qualidade Clinora

on:
  pull_request:
    branches:
      - development
      - homologation
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fundacao:
    name: Testes e builds da fundacao
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      STORYBOOK_DISABLE_TELEMETRY: 'true'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Habilitar pnpm via Corepack
        run: corepack enable

      - name: Instalar navegador para testes E2E
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium

      - name: Validar scripts, Java e frontend
        run: corepack pnpm run verify

  solicitar-status:
    name: Solicitar publicacao de status
    needs: fundacao
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disparar publicador
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUALITY_RUN_ID: ${{ github.run_id }}
        run: gh workflow run quality-status.yml --repo "$REPO" --ref development -f "quality_run_id=$QUALITY_RUN_ID"
