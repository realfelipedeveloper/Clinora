name: clinora-local

x-java: &java
  image: eclipse-temurin:25.0.4.1_1-jre-alpine-3.24
  command: ['java', '-jar', '/app.jar']
  user: '10001:10001'
  read_only: true
  init: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test:
      ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/actuator/health/readiness']
    interval: 10s
    timeout: 3s
    start_period: 30s
    retries: 6

x-static: &static
  image: nginxinc/nginx-unprivileged:alpine3.24
  read_only: true
  init: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 6

services:
  redis:
    image: redis:8.10.2-alpine3.23
    command: ['sh', '/usr/local/bin/redis-start.sh']
    user: '10001:10001'
    read_only: true
    init: true
    tmpfs: ['/tmp']
    environment:
      CLINORA_CORE_REDIS_PASSWORD: ${CLINORA_CORE_REDIS_PASSWORD:-clinora_core_redis_local_only}
      CLINORA_PAYMENTS_REDIS_PASSWORD: ${CLINORA_PAYMENTS_REDIS_PASSWORD:-clinora_payments_redis_local_only}
      CLINORA_NOTIFICATIONS_REDIS_PASSWORD: ${CLINORA_NOTIFICATIONS_REDIS_PASSWORD:-clinora_notifications_redis_local_only}
      CLINORA_INTEGRATIONS_REDIS_PASSWORD: ${CLINORA_INTEGRATIONS_REDIS_PASSWORD:-clinora_integrations_redis_local_only}
      CLINORA_SCHEDULER_REDIS_PASSWORD: ${CLINORA_SCHEDULER_REDIS_PASSWORD:-clinora_scheduler_redis_local_only}
    ports:
      - target: 6379
        published: ${CLINORA_REDIS_PORT:-44240}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./infra/docker/redis/start.sh
        target: /usr/local/bin/redis-start.sh
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$CLINORA_CORE_REDIS_PASSWORD" redis-cli --user clinora_core ping | grep -qx PONG
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: clinora-rabbit
    ports:
      - target: 5672
        published: ${CLINORA_RABBIT_AMQP_PORT:-44250}
        host_ip: 127.0.0.1
      - target: 15672
        published: ${CLINORA_RABBIT_UI_PORT:-44251}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: rabbitmq-data
        target: /var/lib/rabbitmq
      - type: bind
        source: ./infra/docker/rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/rabbitmq/definitions.json
        target: /etc/rabbitmq/definitions.json
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: clinora_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CLINORA_POSTGRES_ADMIN_PASSWORD:-clinora_admin_local_only}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLINORA_CORE_DB_PASSWORD: ${CLINORA_CORE_DB_PASSWORD:-clinora_core_local_only}
      CLINORA_PAYMENTS_DB_PASSWORD: ${CLINORA_PAYMENTS_DB_PASSWORD:-clinora_payments_local_only}
      CLINORA_NOTIFICATIONS_DB_PASSWORD: ${CLINORA_NOTIFICATIONS_DB_PASSWORD:-clinora_notifications_local_only}
      CLINORA_INTEGRATIONS_DB_PASSWORD: ${CLINORA_INTEGRATIONS_DB_PASSWORD:-clinora_integrations_local_only}
    ports:
      - target: 5432
        published: ${CLINORA_POSTGRES_PORT:-44230}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infra/docker/postgres/10-databases.sh
        target: /docker-entrypoint-initdb.d/10-databases.sh
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres -tAc ''SELECT 1'' | grep -qx 1',
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  web:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_WEB_PORT:-44210}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/web/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  docs:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_DOCS_PORT:-44211}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/docs/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  core-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_CORE_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_CORE_API_PORT:-44220}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/core-api/target/core-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  payment-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_PAYMENT_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_PAYMENT_API_PORT:-44221}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/payment-api/target/payment-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  notification-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_NOTIFICATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_NOTIFICATION_API_PORT:-44222}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/notification-api/target/notification-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  integration-api:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_INTEGRATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_INTEGRATION_API_PORT:-44223}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/integration-api/target/integration-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  scheduler-worker:
    <<: *java
    environment:
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_SCHEDULER_WORKER_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_SCHEDULER_WORKER_PORT:-44224}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/scheduler-worker/target/scheduler-worker-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

networks:
  clinora:
    name: clinora-local-network

volumes:
  postgres-data:
  rabbitmq-data:
