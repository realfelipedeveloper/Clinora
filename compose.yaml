name: clinora-local

x-java: &java
  image: eclipse-temurin:25.0.4.1_1-jre-alpine-3.24
  command: ['java', '-jar', '/app.jar']
  user: '10001:10001'
  read_only: true
  init: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test:
      ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/actuator/health/readiness']
    interval: 10s
    timeout: 3s
    start_period: 30s
    retries: 6

x-static: &static
  image: nginxinc/nginx-unprivileged:alpine3.24
  read_only: true
  init: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  networks: [clinora]
  healthcheck:
    test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 6

services:
  redis:
    image: redis:8.10.2-alpine3.23
    command: ['sh', '/usr/local/bin/redis-start.sh']
    user: '10001:10001'
    read_only: true
    init: true
    tmpfs: ['/tmp']
    environment:
      CLINORA_CORE_REDIS_PASSWORD: ${CLINORA_CORE_REDIS_PASSWORD:-clinora_core_redis_local_only}
      CLINORA_PAYMENTS_REDIS_PASSWORD: ${CLINORA_PAYMENTS_REDIS_PASSWORD:-clinora_payments_redis_local_only}
      CLINORA_NOTIFICATIONS_REDIS_PASSWORD: ${CLINORA_NOTIFICATIONS_REDIS_PASSWORD:-clinora_notifications_redis_local_only}
      CLINORA_INTEGRATIONS_REDIS_PASSWORD: ${CLINORA_INTEGRATIONS_REDIS_PASSWORD:-clinora_integrations_redis_local_only}
      CLINORA_SCHEDULER_REDIS_PASSWORD: ${CLINORA_SCHEDULER_REDIS_PASSWORD:-clinora_scheduler_redis_local_only}
    ports:
      - target: 6379
        published: ${CLINORA_REDIS_PORT:-44240}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./infra/docker/redis/start.sh
        target: /usr/local/bin/redis-start.sh
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$CLINORA_CORE_REDIS_PASSWORD" redis-cli --user clinora_core ping | grep -qx PONG
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: clinora-rabbit
    ports:
      - target: 5672
        published: ${CLINORA_RABBIT_AMQP_PORT:-44250}
        host_ip: 127.0.0.1
      - target: 15672
        published: ${CLINORA_RABBIT_UI_PORT:-44251}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: rabbitmq-data
        target: /var/lib/rabbitmq
      - type: bind
        source: ./infra/docker/rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/rabbitmq/definitions.json
        target: /etc/rabbitmq/definitions.json
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.32.0
    user: '10001:10001'
    read_only: true
    init: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_UI_AUTH: ${CLINORA_MAIL_UI_AUTH:-clinora_local:clinora_mail_local_only_2026}
      MP_ALLOWED_HOSTS: mailpit,127.0.0.1:${CLINORA_MAIL_UI_PORT:-44261}
      MP_MAX_MESSAGES: '100'
      MP_MAX_AGE: 1d
      MP_MAX_MESSAGE_SIZE: '1'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_BLOCK_REMOTE_CSS_AND_FONTS: 'true'
      MP_SMTP_ALLOWED_RECIPIENTS: '@example[.]test\z'
    ports:
      - target: 1025
        published: ${CLINORA_MAIL_SMTP_PORT:-44260}
        host_ip: 127.0.0.1
      - target: 8025
        published: ${CLINORA_MAIL_UI_PORT:-44261}
        host_ip: 127.0.0.1
    networks: [clinora]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  garage:
    image: dxflrs/garage:v2.5.0
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    read_only: true
    init: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: clinora-smoke
    ports:
      - target: 3900
        published: ${CLINORA_GARAGE_S3_PORT:-44270}
        host_ip: 127.0.0.1
      - target: 3903
        published: ${CLINORA_GARAGE_ADMIN_PORT:-44271}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: garage-data
        target: /data
      - type: bind
        source: ./infra/docker/garage/garage.toml
        target: /etc/garage.toml
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.15.1
    read_only: true
    init: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    ports:
      - target: 9090
        published: ${CLINORA_PROMETHEUS_PORT:-44281}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./infra/observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind: { create_host_path: false }
      - type: volume
        source: prometheus-data
        target: /prometheus
    networks: [clinora]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  grafana:
    image: grafana/grafana:13.3.0
    user: '472:472'
    init: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    environment:
      GF_SECURITY_ADMIN_USER: clinora_local
      GF_SECURITY_ADMIN_PASSWORD: ${CLINORA_GRAFANA_ADMIN_PASSWORD:-clinora_grafana_local_only_2026}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - target: 3000
        published: ${CLINORA_GRAFANA_PORT:-44280}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: ./infra/observability/grafana-datasource.yml
        target: /etc/grafana/provisioning/datasources/clinora.yml
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: clinora_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CLINORA_POSTGRES_ADMIN_PASSWORD:-clinora_admin_local_only}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLINORA_CORE_DB_PASSWORD: ${CLINORA_CORE_DB_PASSWORD:-clinora_core_local_only}
      CLINORA_PAYMENTS_DB_PASSWORD: ${CLINORA_PAYMENTS_DB_PASSWORD:-clinora_payments_local_only}
      CLINORA_NOTIFICATIONS_DB_PASSWORD: ${CLINORA_NOTIFICATIONS_DB_PASSWORD:-clinora_notifications_local_only}
      CLINORA_INTEGRATIONS_DB_PASSWORD: ${CLINORA_INTEGRATIONS_DB_PASSWORD:-clinora_integrations_local_only}
    ports:
      - target: 5432
        published: ${CLINORA_POSTGRES_PORT:-44230}
        host_ip: 127.0.0.1
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infra/docker/postgres/10-databases.sh
        target: /docker-entrypoint-initdb.d/10-databases.sh
        read_only: true
        bind: { create_host_path: false }
    networks: [clinora]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres -tAc ''SELECT 1'' | grep -qx 1',
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  web:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_WEB_PORT:-44210}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/web/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  docs:
    <<: *static
    ports:
      - target: 8080
        published: ${CLINORA_DOCS_PORT:-44211}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./dist/docs/browser
        target: /usr/share/nginx/html
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }

  core-api:
    <<: *java
    environment:
      SPRING_PROFILES_ACTIVE: observability
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_CORE_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_CORE_API_PORT:-44220}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/core-api/target/core-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  payment-api:
    <<: *java
    environment:
      SPRING_PROFILES_ACTIVE: observability
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_PAYMENT_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_PAYMENT_API_PORT:-44221}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/payment-api/target/payment-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  notification-api:
    <<: *java
    environment:
      SPRING_PROFILES_ACTIVE: observability
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_NOTIFICATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_NOTIFICATION_API_PORT:-44222}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/notification-api/target/notification-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  integration-api:
    <<: *java
    environment:
      SPRING_PROFILES_ACTIVE: observability
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_INTEGRATION_API_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_INTEGRATION_API_PORT:-44223}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/integration-api/target/integration-api-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

  scheduler-worker:
    <<: *java
    environment:
      SPRING_PROFILES_ACTIVE: observability
      CLINORA_BIND_ADDRESS: 0.0.0.0
      CLINORA_SCHEDULER_WORKER_PORT: 8080
    ports:
      - target: 8080
        published: ${CLINORA_SCHEDULER_WORKER_PORT:-44224}
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ./services/scheduler-worker/target/scheduler-worker-0.0.1-SNAPSHOT.jar
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }

networks:
  clinora:
    name: clinora-local-network

volumes:
  postgres-data:
  rabbitmq-data:
  garage-data:
  prometheus-data:
  grafana-data:
